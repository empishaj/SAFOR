name: SAFOR Validation

on:
  push:
    branches:
      - main
      - "safor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reproducible bundle
        run: python tools/build_bundle.py --check
      - name: Check domain Framework distributions
        run: python tools/build_domain_framework.py --check
      - name: Validate SAFOR distribution
        run: python tools/validate_safor.py
      - name: Run deterministic control tests
        run: python -m unittest discover -s tests -v
