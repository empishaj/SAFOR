name: Materialize SAFOR rc.8 HUMAN Notice

on:
  push:
    branches:
      - safor/human-notice-100-conformance
    paths:
      - .github/workflows/materialize-rc8.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: safor/human-notice-100-conformance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct verified implementation script
        shell: bash
        run: |
          set -euo pipefail
          cat .rc8/part* > /tmp/rc8-payload.b64
          echo "244dbf9c48589920b7e0c73034da3c20a087eb00505f49d911c83c863b42b909  /tmp/rc8-payload.b64" | sha256sum -c -
          base64 --decode /tmp/rc8-payload.b64 | gzip --decompress > tools/implement_human_notice_rc8.py
          echo "7a8cf5c96fce8f31f49fa43723dcb3a9fb6c417732848692fe1c08705d3f25f6  tools/implement_human_notice_rc8.py" | sha256sum -c -
          python -m py_compile tools/implement_human_notice_rc8.py

      - name: Apply canonical rc.8 sources and contracts
        run: python tools/implement_human_notice_rc8.py

      - name: Align onboarding contract and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = Path("START-HIER.md")
          text = guide.read_text(encoding="utf-8")
          needle = "Der Chat interpretiert den eingebetteten SAFOR-Vertrag und nutzt ausschließlich die Werkzeuge und Git-Rechte, die der Host tatsächlich bereitstellt."
          replacement = (
              "Ein normaler Chat führt den Python-Referenzcode nicht automatisch aus. "
              "Das ist keine Installationsvoraussetzung: Der Chat interpretiert den eingebetteten SAFOR-Vertrag "
              "und nutzt ausschließlich die Werkzeuge und Git-Rechte, die der Host tatsächlich bereitstellt."
          )
          if needle not in text:
              raise SystemExit("Expected onboarding paragraph not found")
          guide.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          test_file = Path("tests/test_user_onboarding.py")
          tests = test_file.read_text(encoding="utf-8")
          start = tests.index("    def test_german_guide_explains_manual_chat_vs_runtime_enforcement")
          end = tests.index("\n    def test_quickstart", start)
          new_test = '''    def test_german_guide_explains_declarative_chat_and_optional_reference_runtime(self):
              self.assertIn("führt den Python-Referenzcode", self.start_here)
              self.assertIn("nicht automatisch", self.start_here)
              self.assertIn("nicht erforderlich", self.start_here)
              self.assertIn("optionale Referenz-", self.start_here)
              self.assertNotIn("Host-/Runtime-Integration Pflicht", self.start_here)
          '''
          test_file.write_text(tests[:start] + new_test + tests[end:], encoding="utf-8")
          PY

      - name: Rebuild generic Framework distribution
        run: python tools/build_bundle.py

      - name: Rebuild Website domain Framework
        run: python tools/build_domain_framework.py --profile WEBSITE --output SAFOR-FRAMEWORK-WEBSITE.json

      - name: Rebuild SaaS evaluation Framework
        run: python tools/build_domain_framework.py --profile SAAS --output SAFOR-FRAMEWORK-SAAS.json

      - name: Rebuild Book evaluation Framework
        run: python tools/build_domain_framework.py --profile BOOK_CREATION --output SAFOR-FRAMEWORK-BOOK-CREATION.json

      - name: Verify reproducible generic Framework
        run: python tools/build_bundle.py --check

      - name: Verify reproducible domain Frameworks
        run: python tools/build_domain_framework.py --check

      - name: Validate SAFOR distribution
        run: python tools/validate_safor.py

      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v

      - name: Remove one-shot materialization files
        shell: bash
        run: |
          rm -rf .rc8
          rm -f tools/implement_human_notice_rc8.py
          rm -rf tools/__pycache__
          rm -f .github/workflows/materialize-rc8.yml

      - name: Commit validated rc.8 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 1
          fi
          git commit -m "SAFOR rc.8: implement HUMAN GO agent orchestration contracts"
          git push origin HEAD:safor/human-notice-100-conformance
