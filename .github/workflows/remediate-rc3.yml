name: Remediate SAFOR 0.14.0-rc.3

on:
  push:
    branches:
      - safor/audit-remediation-0.14.0-rc.3
    paths:
      - .release/remediate_rc3.py
      - .release/remediate_rc3_hotfix.py
      - .github/workflows/remediate-rc3.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: safor/audit-remediation-0.14.0-rc.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical rc.3 source corrections
        run: python .release/remediate_rc3.py prepare

      - name: Embed the authoritative domain profile catalog
        run: python .release/remediate_rc3_hotfix.py

      - name: Build generic Framework
        run: python tools/build_bundle.py

      - name: Build all domain Framework distributions
        run: python tools/build_domain_framework.py --profile WEBSITE && python tools/build_domain_framework.py --profile SAAS && python tools/build_domain_framework.py --profile BOOK_CREATION

      - name: Finalize release evidence and checksums
        run: python .release/remediate_rc3.py finalize

      - name: Check reproducible generic Framework
        run: python tools/build_bundle.py --check

      - name: Check reproducible domain Frameworks
        run: python tools/build_domain_framework.py --check

      - name: Validate SAFOR distribution
        run: python tools/validate_safor.py

      - name: Validate audit remediation
        run: python tools/validate_audit_remediation.py

      - name: Validate requirements traceability
        run: python tools/validate_traceability.py

      - name: Run complete unit and regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify distribution checksums
        run: sha256sum --check SHA256SUMS-0.14.0-rc.3.txt

      - name: Mark automated validation pass
        run: python .release/remediate_rc3.py mark-pass

      - name: Remove one-shot remediation machinery
        shell: bash
        run: |
          rm -f .release/remediate_rc3.py
          rm -f .release/remediate_rc3_hotfix.py
          rmdir .release 2>/dev/null || true
          rm -f .github/workflows/remediate-rc3.yml

      - name: Commit validated rc.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 1
          fi
          git commit -m "SAFOR 0.14.0-rc.3: remediate independent audit findings"
          git push origin HEAD:safor/audit-remediation-0.14.0-rc.3
