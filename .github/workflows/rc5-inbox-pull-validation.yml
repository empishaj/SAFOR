name: SAFOR rc.5 Inbox Pull Validation

on:
  push:
    branches:
      - safor/inbox-pull-agent-0.14.0-rc.5

permissions:
  contents: read

jobs:
  validate-inbox-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit and active contracts
        run: python tools/validate_audit_remediation.py
      - name: Run inbox-pull orchestration regressions
        run: |
          python -m unittest             tests.test_agent_activation_v014             tests.test_go_evidence_v014             tests.test_go_claim_integrity_v014             tests.test_agent_job_v014             tests.test_master_scheduler_v014             tests.test_audit_remediation_rc3 -v
