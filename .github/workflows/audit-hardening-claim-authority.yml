name: SAFOR Audit Hardening Validation

on:
  push:
    branches:
      - safor/audit-hardening-claim-authority-rc5

permissions:
  contents: read

jobs:
  validate-audit-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit contracts
        run: python tools/validate_audit_remediation.py

      - name: Validate documentation consistency
        run: python tools/validate_content_consistency.py

      - name: Run audit-hardening regressions
        run: |
          python -m unittest \
            tests.test_go_evidence_v014 \
            tests.test_go_claim_integrity_v014 \
            tests.test_claim_authority_separation_v014 \
            tests.test_k10a_binding_gate_v014 \
            tests.test_agent_activation_v014 \
            tests.test_modular_bootstrap \
            tests.test_audit_remediation_rc3 -v
