name: SAFOR rc.4 Step Validation

on:
  push:
    branches:
      - safor/review-remediation-0.14.0-rc.4
    paths:
      - "v0.14.0/**"
      - "runtime/**"
      - "tools/validate_audit_remediation.py"
      - "tests/test_audit_remediation_rc3.py"
      - "docs/master-subagent-orchestration/RC4-BASELINE-AND-REVIEW-DISPOSITION.json"
      - ".github/workflows/rc4-step-validation.yml"

permissions:
  contents: read

jobs:
  validate-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit remediation contracts
        run: python tools/validate_audit_remediation.py
      - name: Run focused rc.4 remediation regression tests
        run: python -m unittest tests.test_audit_remediation_rc3 tests.test_workspace_initialization_v014 tests.test_human_response_classification_v014 tests.test_go_claim_integrity_v014 -v
