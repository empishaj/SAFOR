name: Prepare creation-type correction (one review branch)
on:
  push:
    branches: ["fix/creation-types-v014-rc3-20261018"]
    paths:
      - "tools/prepare_v014_rc3.py"
      - "runtime/creation_type_contract.py"
      - "tests/test_creation_type_contract.py"
      - ".github/workflows/prepare-creation-type-fix.yml"
permissions:
  contents: write
concurrency:
  group: creation-type-fix-v014-rc3
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'empishaj/SAFOR' && github.ref == 'refs/heads/fix/creation-types-v014-rc3-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce the pre-fix failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/safor-creation-type-evidence
          if python -m unittest discover -s tests -p test_creation_type_contract.py -v > /tmp/safor-creation-type-evidence/baseline.log 2>&1; then
            cat /tmp/safor-creation-type-evidence/baseline.log
            echo 'Expected the unchanged rc.2 baseline to fail the regression tests.'
            exit 1
          fi
          cat /tmp/safor-creation-type-evidence/baseline.log
      - name: Apply pinned source correction and rebuild distributions
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_v014_rc3.py --apply
          python tools/build_bundle.py
          for profile in WEBSITE SAAS BOOK_CREATION; do
            python tools/build_domain_framework.py --profile "$profile"
          done
      - name: Verify all builds and run the full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_bundle.py --check 2>&1 | tee /tmp/safor-creation-type-evidence/bundle.log
          python tools/build_domain_framework.py --check 2>&1 | tee /tmp/safor-creation-type-evidence/domains.log
          python tools/validate_safor.py 2>&1 | tee /tmp/safor-creation-type-evidence/validate.log
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/safor-creation-type-evidence/tests.log
          python tools/prepare_v014_rc3.py --evidence /tmp/safor-creation-type-evidence
          sha256sum -c SHA256SUMS-0.14.0-rc.3.txt
      - name: Commit verified outputs only to the dedicated review branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/creation-types-v014-rc3-20261018
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git diff --exit-code -- v0.13.0 v0.12.0 v0.11.0 v0.10.0 SAFOR-FRAMEWORK-v0.14.0-rc.2.json
          git add VERSION README.md CHANGELOG.md RELEASE-MANIFEST.json \
            v0.14.0/schemas/project.schema.json v0.14.0/SAFOR-MASTER.json \
            v0.14.0/interaction-model.json v0.14.0/conformance.json \
            tools/build_bundle.py tools/build_domain_framework.py tools/validate_safor.py \
            SAFOR-FRAMEWORK.json SAFOR-FRAMEWORK-v0.14.0-rc.3.json \
            SAFOR-FRAMEWORK-WEBSITE.json SAFOR-FRAMEWORK-SAAS.json SAFOR-FRAMEWORK-BOOK-CREATION.json \
            RELEASE-NOTES-0.14.0-rc.3.md RELEASE-EVIDENCE-0.14.0-rc.3.json SHA256SUMS-0.14.0-rc.3.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix: align v0.14 creation types and regenerate rc.3 distributions'
          git push origin "HEAD:refs/heads/$branch"
      - name: Package source and diagnostic evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/safor-creation-type-evidence
          git diff > /tmp/safor-creation-type-evidence/uncommitted.patch
          git archive --format=zip --output=/tmp/safor-source-candidate.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safor-creation-type-candidate
          path: |
            /tmp/safor-source-candidate.zip
            /tmp/safor-creation-type-evidence/
          retention-days: 7
