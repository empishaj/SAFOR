name: Materialize SAFOR 0.13.0-rc.9

on:
  push:
    branches:
      - safor/framework-0.13.0-rc.9
    paths:
      - .github/workflows/materialize-rc9.yml
      - .release/materialize_rc9.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: safor/framework-0.13.0-rc.9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare rc.9 release sources and metadata
        run: python .release/materialize_rc9.py prepare

      - name: Build generic Framework
        run: python tools/build_bundle.py

      - name: Build Website Framework
        run: python tools/build_domain_framework.py --profile WEBSITE

      - name: Build SaaS evaluation Framework
        run: python tools/build_domain_framework.py --profile SAAS

      - name: Build Book evaluation Framework
        run: python tools/build_domain_framework.py --profile BOOK_CREATION

      - name: Finalize release evidence and checksums
        run: python .release/materialize_rc9.py finalize

      - name: Verify reproducible generic Framework
        run: python tools/build_bundle.py --check

      - name: Verify reproducible domain Frameworks
        run: python tools/build_domain_framework.py --check

      - name: Validate SAFOR distribution
        run: python tools/validate_safor.py

      - name: Run complete unit and regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify release file inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f SAFOR-FRAMEWORK-v0.13.0-rc.9.json
          test ! -e SAFOR-FRAMEWORK-v0.13.0-rc.8.json
          cmp SAFOR-FRAMEWORK.json SAFOR-FRAMEWORK-v0.13.0-rc.9.json
          test -f RELEASE-EVIDENCE-0.13.0-rc.9.json
          test -f RELEASE-NOTES-0.13.0-rc.9.md
          test -f SHA256SUMS-0.13.0-rc.9.txt
          sha256sum --check SHA256SUMS-0.13.0-rc.9.txt

      - name: Remove one-shot materialization helpers
        shell: bash
        run: |
          rm -f .release/materialize_rc9.py
          rmdir .release 2>/dev/null || true
          rm -f .github/workflows/materialize-rc9.yml

      - name: Commit validated rc.9 Framework release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "SAFOR 0.13.0-rc.9: publish consolidated Framework distributions"
          git push origin HEAD:safor/framework-0.13.0-rc.9
